name: Buffet CRM image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: |
            ghcr.io/kauamenesesr7-ui/buffet-crm-frontend:latest
            ghcr.io/kauamenesesr7-ui/buffet-crm-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
