server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    # NOTE: Do not set X-Frame-Options globally because /widget must be embeddable in third-party sites.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    # CSP: 'wasm-unsafe-eval' is required by FFmpeg WASM (self-hosted under /ffmpeg/).
    # 'worker-src blob:' allows the FFmpeg core worker; 'connect-src' is permissive for
    # backend/CDN-less deploys — tighten per environment if needed.
    # script-src allows the Facebook SDK (WhatsApp Cloud / Facebook / Instagram Embedded
    # Signup) and Google Tag Manager (GA4) — both load external scripts that would
    # otherwise be blocked. 'blob:' is required by FFmpeg WASM which loads its worker
    # as a Blob URL; connect-src 'blob:' is required so the audio recorder can fetch
    # the recorded blob before transcoding to OGG/Opus.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' blob: https://connect.facebook.net https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' blob: https: wss: ws:; frame-src 'self' https://*.facebook.com; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;

    # Widget route must be embeddable in customer websites (iframe).
    location = /widget {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    location ^~ /widget/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        try_files $uri $uri/ /index.html;
    }

    # Backward-compatible same-origin API entrypoint. Older frontend bundles
    # used the public frontend origin for API requests; proxying those paths
    # keeps already-open tabs functional and also provides a resilient fallback
    # if the dedicated API URL is unavailable in a future runtime injection.
    location ~ ^/(api/|setup(?:/|$)|oauth(?:/|$)|\.well-known(?:/|$)|rails/active_storage/|webhooks(?:/|$)|cable(?:/|$)) {
        proxy_pass http://gateway:3030;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header api_access_token $http_api_access_token;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        client_max_body_size 100M;
    }

    # The SPA shell must always be revalidated. Keeping index.html cached can
    # pin users to an old asset manifest after a deployment, while the API and
    # containers have already moved to the new version.
    location = /index.html {
        expires -1;
        try_files /index.html =404;
    }

    # SPA routing - serve index.html for all routes. Static assets still use
    # the immutable one-year cache rule below because their names are hashed.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
